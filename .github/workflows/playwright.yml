name: GreenCity CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; jobs that need more ask for it explicitly
permissions:
  contents: read

# One run per branch/PR: a new push cancels the outdated run
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HEADLESS: true
  CI: true

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 # matches README (Node 24+)
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

  run-tests:
    needs: lint-and-format
    # Fork PRs have no access to secrets, so tests would fail there anyway
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [api, chromium, firefox, webkit]
    # Secrets are exposed only to the job that needs them
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      API_USER_BASE_URL: ${{ secrets.API_USER_BASE_URL }}
      API_GREENCITY_BASE_URL: ${{ secrets.API_GREENCITY_BASE_URL }}
      USER_EMAIL: ${{ secrets.USER_EMAIL }}
      USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
      USER_ID: ${{ secrets.USER_ID }}
      USER_NAME: ${{ secrets.USER_NAME }}
      # Timeouts are not sensitive: move them to Settings -> Variables
      SHORT_TIMEOUT: ${{ secrets.SHORT_TIMEOUT }}
      MEDIUM_TIMEOUT: ${{ secrets.MEDIUM_TIMEOUT }}
      LONG_TIMEOUT: ${{ secrets.LONG_TIMEOUT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        if: ${{ matrix.browser != 'api' }}
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser and OS deps
        if: ${{ matrix.browser != 'api' && steps.playwright-cache.outputs.cache-hit != 'true' }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Install Playwright OS deps only (browser restored from cache)
        if: ${{ matrix.browser != 'api' && steps.playwright-cache.outputs.cache-hit == 'true' }}
        run: npx playwright install-deps ${{ matrix.browser }}

      # Failed assertions must NOT turn the job red, but real errors must.
      # Step 1: run the tests and only record the exit code.
      - name: Run Playwright tests
        id: pw
        run: |
          set +e
          npx playwright test --project=${{ matrix.browser }} --pass-with-no-tests
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      # Step 2: decide what the exit code means using the JSON report.
      - name: Classify test run result
        id: classify
        run: |
          f=playwright-results.json
          code="${{ steps.pw.outputs.exit_code }}"

          if [ "$code" = "0" ]; then
            echo "✅ All tests passed"
            exit 0
          fi

          # Non-zero exit code but no report -> Playwright crashed or config is broken
          if [ ! -f "$f" ]; then
            echo "::error::Playwright exited with code $code and produced no JSON report (crash / config / project error)"
            exit 1
          fi

          errors=$(jq '.errors | length' "$f")
          total=$(jq '.stats | .expected + .unexpected + .flaky + .skipped' "$f")
          failed=$(jq '.stats.unexpected' "$f")

          if [ "$errors" -gt 0 ]; then
            echo "::error::Playwright reported $errors global error(s) (config, globalSetup, import, ...)"
            jq -r '.errors[].message' "$f" | head -n 20
            exit 1
          fi

          if [ "$total" -eq 0 ]; then
            if [ "${{ matrix.browser }}" = "api" ]; then
              echo "::notice::No API tests executed."
              exit 0
            fi
            echo "::error::No tests were executed for project ${{ matrix.browser }}"
            exit 1
          fi

          if [ "$failed" -eq 0 ]; then
            echo "::error::Exit code $code but no failed tests recorded (interrupted run / timeout?)"
            exit 1
          fi

          echo "::warning::${{ matrix.browser }}: $failed test(s) failed (see the Allure report). Job stays green by design."
          echo "### ⚠️ ${{ matrix.browser }}: $failed of $total tests failed" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload Playwright report and traces when tests failed
        if: ${{ !cancelled() && steps.pw.outputs.exit_code != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-debug-${{ matrix.browser }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  generate-report:
    needs: run-tests
    if: ${{ !cancelled() && needs.run-tests.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push to gh-pages
      pull-requests: write # PR comment
    # Serialise only the gh-pages publishing, not the whole workflow
    concurrency:
      group: allure-gh-pages
      cancel-in-progress: false
    env:
      REPORT_FOLDER: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'main' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Allure history
        continue-on-error: true # gh-pages may not exist yet
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: combined-results
          merge-multiple: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate combined Allure report
        run: |
          echo "Preparing previous history..."
          HISTORY_FILE="history.jsonl"

          # Check if history from previous run exists
          if [ -f "gh-pages/${REPORT_FOLDER}/last-history/$HISTORY_FILE" ]; then
            echo "Found previous history file. Copying..."
            cp "gh-pages/${REPORT_FOLDER}/last-history/$HISTORY_FILE" "$HISTORY_FILE"
            
            # Generate new report WITH history dump
            echo "Generating Allure report with history..."
            npx allure generate combined-results --output allure-report --dump "$HISTORY_FILE"
          else
            echo "No previous history found. Generating initial report..."
            npx allure generate combined-results --output allure-report
          fi

          echo "Extracting new history state for the next run..."
          npx allure history combined-results --history-path "$HISTORY_FILE" || echo "Failed to generate history dump, proceeding anyway"

          echo "Preparing allure-history directory structure for deployment..."
          mkdir -p "allure-history/${REPORT_FOLDER}"
          cp -r allure-report/* "allure-history/${REPORT_FOLDER}/"

          # Store the newly extracted history file for the NEXT run
          mkdir -p "allure-history/${REPORT_FOLDER}/last-history"
          cp "$HISTORY_FILE" "allure-history/${REPORT_FOLDER}/last-history/" 2>/dev/null || true

          # Store a numbered snapshot for deep linking
          mkdir -p "allure-history/${REPORT_FOLDER}/${{ github.run_number }}"
          cp -r allure-report/* "allure-history/${REPORT_FOLDER}/${{ github.run_number }}/" || true

      - name: Clean heavy attachments from history
        run: |
          echo "Cleaning heavy attachments from allure-history..."
          find allure-history -type f -name "*-attachment*" -size +1M -delete -print
          find allure-history -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.mp4" -o -name "*.webm" \) -delete -print

      - name: Deploy Allure report
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          keep_files: true
          force_orphan: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Comment PR with report link
        if: ${{ github.event_name == 'pull_request' }}
        uses: thollander/actions-comment-pull-request@v2
        with:
          comment_tag: allure-report-link
          message: |
            📊 **Allure Report for PR-${{ github.event.number }} (all tests & browsers)**

            🔗 https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ env.REPORT_FOLDER }}/

      - name: Job summary
        run: |
          f=allure-report/summary.json
          if [ -f "$f" ]; then
            jq -r '"### Allure: total \(.stats.total // 0), passed \(.stats.passed // 0), skipped \(.stats.skipped // 0), retries \(.stats.retries // 0) | status: \(.status)"' "$f" >> "$GITHUB_STEP_SUMMARY"
          fi
